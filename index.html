<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Open URLs with Delay</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
    }
    input {
      width: 80%;
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h2>Open Multiple URLs (with 1-second delay)</h2>
  <input type="text" id="urlInput" placeholder="Enter comma-separated URLs">
  <button id="openButton">Open URLs</button>

  <script>
    document.getElementById('openButton').addEventListener('click', function () {
      const input = document.getElementById('urlInput').value;
      const urls = input.split(',').map(url => url.trim()).filter(url => url);

      urls.forEach((url, index) => {
        setTimeout(() => {
          const finalUrl = url.match(/^https?:\/\//) ? url : 'http://' + url;
          window.open(finalUrl, '_blank');
        }, index * 1000); // Delay of 1000ms per URL
      });
    });
  </script>
</body>
</html>
