<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Open URLs from CSV</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
    }
    input, button {
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>Upload CSV File with URLs</h2>
  <input type="file" id="fileInput" accept=".csv">
  <br>
  <button onclick="processFile()">Open URLs</button>

  <script>
    function processFile() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      if (!file) {
        alert("Please select a CSV file first.");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        const lines = text.split(/\r?\n/).map(line => line.trim()).filter(line => line);

        lines.forEach((url, index) => {
          setTimeout(() => {
            const finalUrl = url.match(/^https?:\/\//) ? url : 'http://' + url;
            window.open(finalUrl, '_blank');
          }, index * 1000); // 1-second delay per URL
        });
      };

      reader.readAsText(file);
    }
  </script>
</body>
</html>
