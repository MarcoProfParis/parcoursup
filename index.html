<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Open Multiple URLs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
    }
    input {
      width: 80%;
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h2>Open Multiple URLs</h2>
  <input type="text" id="urlInput" placeholder="https://example.com, https://another.com">
  <button id="openButton">Open URLs</button>

  <script>
    document.getElementById('openButton').addEventListener('click', function () {
      const input = document.getElementById('urlInput').value;
      const urls = input.split(',').map(url => url.trim()).filter(url => url);

      // Open each URL in a new tab/window synchronously
      for (let url of urls) {
        const finalUrl = url.match(/^https?:\/\//) ? url : 'http://' + url;
        window.open(finalUrl, '_blank');
      }
    });
  </script>
</body>
</html>
